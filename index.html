<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Guided Conversation Builder</title>
<style>
:root{--brand:#b91e71;--ink:#202124;--muted:#667085;--line:#d0d5dd;--bg:#f5f7fa;--card:#fff}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;position:sticky;top:0;z-index:5}
.toprow{max-width:1450px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top h1{font-size:20px;margin:0 auto 0 0}.btn{border:0;border-radius:7px;padding:9px 12px;background:var(--brand);color:#fff}
.btn.secondary{background:#e9ecef;color:#111}.btn.danger{background:#b42318}.btn.small{padding:6px 9px;font-size:13px}
.layout{max-width:1450px;margin:18px auto;display:grid;grid-template-columns:300px minmax(420px,1fr) 440px;gap:16px;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 1px 2px #0000000a}
.card h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
input[type=text],input[type=url],textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff}
textarea{min-height:78px;resize:vertical}.check{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px}.check input{width:auto}
.navitem,.qitem{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px;margin:5px 0}
.navitem.active,.qitem.active{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.qmeta{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row .fit{flex:0 0 auto}
hr{border:0;border-top:1px solid #eaecf0;margin:16px 0}
.response{border:1px solid var(--line);border-radius:9px;padding:10px;margin:10px 0;background:#fafafa}
.action{border-left:3px solid #98a2b3;padding:8px 8px 8px 10px;margin:8px 0;background:#fff}
.action-head{display:flex;gap:8px;align-items:center}.action-head strong{flex:1}
.preview{background:#f8f9fa;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:580px}
.preview-title{font-weight:700;font-size:18px;margin-bottom:10px}
.progress{height:8px;background:#e9ecef;border-radius:20px;overflow:hidden;margin:8px 0 14px}.progress>div{height:100%;background:var(--brand);width:0}
.sectionhead{padding:9px;border-radius:7px;color:#fff;font-weight:700;margin-bottom:10px;background:var(--brand)}
.msg{padding:10px 12px;border-radius:8px;margin:8px 0;line-height:1.45}.bot{background:#fce8f2}.user{background:#e9ecef;margin-left:28%;text-align:right}
.preview-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.preview-buttons button,.linkbtn{border:0;border-radius:6px;padding:8px 11px;background:var(--brand);color:#fff;text-decoration:none;display:inline-block}
.notice{padding:9px;background:#fffaeb;border:1px solid #fedf89;border-radius:7px;font-size:13px;margin:8px 0}
details{margin:8px 0} summary{cursor:pointer;font-weight:700}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.pill{font-size:11px;padding:3px 6px;background:#eef2f6;border-radius:99px}.colour-swatch{width:42px;height:42px;border:1px solid var(--line);border-radius:7px;display:inline-block;flex:0 0 42px}
.settings-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;margin-top:2px}
.form-group{min-width:0}
.form-group label{margin-top:12px}
.colour-field{display:flex;gap:10px;align-items:center}
.colour-field input{min-width:0}
@media(max-width:620px){.settings-pair{grid-template-columns:1fr}}
@media(max-width:1100px){.layout{grid-template-columns:280px 1fr}.previewcard{grid-column:1/-1}}
@media(max-width:760px){.layout{grid-template-columns:1fr}.top{position:static}}
</style>
</head>
<body>
<header class="top"><div class="toprow">
<h1>Guided Conversation Builder</h1>
<button class="btn secondary" onclick="newProject()">New</button>
<button class="btn secondary" onclick="loadStarter('wellbeing')">Wellbeing example</button>
<button class="btn secondary" onclick="loadStarter('dse')">DSE example</button>
<button class="btn secondary" onclick="saveProject()">Save project</button>
<button class="btn secondary" type="button" onclick="document.getElementById('loadFile').click()">Load project</button>
<input id="loadFile" type="file" accept=".json,application/json" style="display:none">
<span id="projectStatus" class="muted" role="status" aria-live="polite"></span>
<button class="btn" onclick="exportBot()">Export bot HTML</button>
</div></header>

<main class="layout">
<aside class="card">
<h2>Build</h2>
<button class="navitem active" data-panel="settings" onclick="selectPanel('settings',this)">Bot settings</button>
<button class="navitem" data-panel="details" onclick="selectPanel('details',this)">User details</button>
<button class="navitem" data-panel="sections" onclick="selectPanel('sections',this)">Sections</button>
<hr>
<div class="row"><strong>Questions</strong><button class="btn small fit" onclick="addQuestion()">+ Add</button></div>
<div id="questionList"></div>
</aside>

<section class="card" id="editor"></section>

<section class="card previewcard">
<div class="row"><h2 style="margin:0">Live preview</h2><button class="btn secondary small fit" onclick="resetPreview()">Restart preview</button></div>
<p class="muted">Preview uses the same project data that will be exported.</p>
<div class="preview" id="preview"></div>
</section>
</main>

<script>
const STARTERS = {"wellbeing": {"version": 1, "settings": {"title": "Wellbeing Support Guide", "welcome": "A short guided conversation to help you find useful wellbeing information and support. Your answers are not saved in this example.", "startLabel": "Start", "primaryColour": "#297289", "collectDetails": false, "recordResponses": false, "showReview": false, "showProgress": true, "completionTitle": "Thanks for checking in", "completionText": "Remember, you can return to the Wellbeing Hub whenever you need information or support."}, "details": [], "sections": [{"id": "wellbeing", "name": "Wellbeing", "colour": "#297289"}], "questions": [{"id": "wb-q1", "section": "Wellbeing", "type": "choice", "text": "Have you ever felt isolated or lonely at work?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "There are sources of support available. You can use the links below to find the most relevant help."}, {"type": "link", "label": "Wellbeing support page", "url": "https://example.org/wellbeing"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Good to hear. If that ever changes, remember that support is available through the Wellbeing Hub."}, {"type": "link", "label": "Visit the Wellbeing Hub", "url": "https://example.org/wellbeing"}, {"type": "continue"}]}]}, {"id": "wb-q2", "section": "Wellbeing", "type": "choice", "text": "Do you know where to find support if work is affecting your wellbeing?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Great — remember it is there whenever you need it."}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "You can find wellbeing resources and routes to support on the Wellbeing Hub."}, {"type": "link", "label": "Open the Wellbeing Hub", "url": "https://example.org/wellbeing"}, {"type": "continue"}]}, {"label": "Not sure", "actions": [{"type": "message", "text": "No problem. The Wellbeing Hub is a useful place to start."}, {"type": "link", "label": "Open the Wellbeing Hub", "url": "https://example.org/wellbeing"}, {"type": "continue"}]}]}]}, "dse": {"version": 1, "settings": {"title": "DSE workstation self-assessment", "welcome": "This self-assessment will guide you through your workstation setup. You can review your responses at the end.", "startLabel": "Start", "primaryColour": "#b91e71", "collectDetails": true, "recordResponses": true, "showReview": true, "showProgress": true, "completionTitle": "Your assessment is complete", "completionText": "Review your responses and use the information provided to make any required adjustments or follow up with your manager."}, "details": [{"label": "Name", "required": true}, {"label": "Base/site", "required": true}, {"label": "Job title", "required": true}, {"label": "Line manager", "required": true}, {"label": "Desk number", "required": false}], "sections": [{"id": "sec-1", "name": "Keyboards", "colour": "#b91e71"}, {"id": "sec-2", "name": "Mouse", "colour": "#b91e71"}, {"id": "sec-3", "name": "Display screens", "colour": "#b91e71"}, {"id": "sec-4", "name": "Other equipment", "colour": "#b91e71"}, {"id": "sec-5", "name": "Software", "colour": "#b91e71"}, {"id": "sec-6", "name": "Furniture", "colour": "#b91e71"}, {"id": "sec-7", "name": "Environment", "colour": "#b91e71"}, {"id": "sec-8", "name": "Final Checks", "colour": "#b91e71"}], "questions": [{"id": "dse-q1", "section": "Keyboards", "type": "choice", "text": "Does your computer set up have a separate screen and a separate keyboard? (This means it is not just the laptop, and it is not just a tablet).", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Good! The keyboard should be separate from the screen, unless you are using your portable device for a short time only. <p>It's ok to use a tablet for up to an hour, or to use your laptop as a portable device for up to around 3 hours, but after that you should have a separate screen and keyboard.</p>"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "The keyboard should be separate from the screen, unless you are using your portable device for a short time only. \n        <p>It’s ok to use a tablet for up to an hour, or to use your laptop as a portable device for up to around 3 hours, but after that you should have a separate screen and keyboard.</p>"}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q2", "section": "Keyboards", "type": "choice", "text": "Are you able to tilt the keyboard to suit your preference?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Remember a comfortable keying position helps reduce strain on your shoulders and wrists."}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Keyboard tilt is a matter of personal preference. Raise the feet under the keyboard to tilt up, or, fold the feet down to use the keyboard flat on the desk."}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q3", "section": "Keyboards", "type": "choice", "text": "Can you find a comfortable keying position? As shown in the first image, you should sit upright and have room to rest your palms or wrists on the desk for support when you are not typing.", "image": "comfortable-keying-position.png", "alt": "User sitting upright with keyboard positioned to allow forearms to rest comfortably and wrists kept straight while typing", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Good!"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Try pushing the screen further back to create more room for the keyboard, hands and wrist. Move the keyboard to allow room to rest your palms or wrists on the desk for support when you are not typing.<p>You might like to use a wrist-rest. Remember to sit upright. You might need to adjust your chair position to help.</p>"}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q4", "section": "Keyboards", "type": "choice", "text": "Do you have good keyboard technique?\n          <p>In order to have a good keyboard technique you should meet this guidance:</p>\n<ul>\n<li>Position your wrists so they are in line with your forearms. Your wrists should not bend up or down</li>\n<li>Avoid hitting the keys too hard</li>\n<li>Avoid overstretching your fingers</li>\n<li>If you rest your wrists on the desk - don’t press down on them</li>\n</ul>\n<p>Do you meet the guidance?</p>", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Well done!"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Can you follow the steps above and bring your keyboard technique in line with the guidance?"}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q5", "section": "Keyboards", "type": "choice", "text": "Are the characters on your keyboard clear and readable?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Good to hear! Remember to keep your keyboard clean â wipes are provided in SAS offices."}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Clean the keyboard. Wipes are provided in SAS offices. You could try tilting your keyboard differently to avoid glare.<p>If the characters still can’t be read, or the keys have become shiny through wear, then your keyboard may need replacing.</p>"}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q6", "section": "Mouse", "type": "choice", "text": "Is the mouse suitable for the tasks you do?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Good to hear! Remember you can reduce your mouse use by using some keyboard commands. You can learn about keyboard commands at  <a href=\"https://support.microsoft.com/en-us/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec\" target=\"_blank\" rel=\"noopener noreferrer\"> Keyboard shortcuts in Windows - Microsoft support."}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Different shapes and sizes of mouse are available. Or, an alternative device such as a tablet may suit your task. You can also use keyboard commands rather than a mouse. Using even a few keyboard commands cuts down on mouse use and is beneficial. You can learn about keyboard commands at <a href=\"https://support.microsoft.com/en-us/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec\" target=\"_blank\" rel=\"noopener noreferrer\">\nKeyboard shortcuts in Windows - Microsoft Support\n</a>."}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q7", "section": "Mouse", "type": "choice", "text": "Do you hold the mouse close to the keyboard?\n         <p>As shown in the image you should:</p>\n<ul>\n<li>Position the mouse close to the keyboard</li>\n<li>Avoid stretching your arm too far to reach the mouse</li>\n<li>Remove your hand from the mouse when not using it – don’t hover</li>\n<li>Keep your arm relaxed and your wrist straight</li>\n</ul>\n<p>You should also:</p>\n<ul>\n<li>Ensure that the mouse cable isn’t catching on anything</li>\n<li>Regularly check that the mouse hasn’t moved away from the keyboard during your shift</li>\n</ul>", "image": "Mouse-hold.png", "alt": "Mouse positioned close to keyboard with relaxed arm and straight wrist to avoid overreaching", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Great!"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Bring your mouse to a suitable position as shown in the image and beware of it moving over your shift."}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q8", "section": "Mouse", "type": "choice", "text": "When you are using the mouse, is there enough support for your wrist and forearm if you need it?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Great! You should be able to position the mouse comfortably. Use the desk surface or your chair’s armrest for support.<p>If these aren’t suitable, a separate support device may help. Mouse mats with built-in wrist supports are available.</p>"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "You should be able to position the mouse comfortably. Use the desk surface or your chair’s armrest for support.<p>If these aren’t suitable, a separate support device may help. Mouse mats with built-in wrist supports are available.</p>"}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q9", "section": "Mouse", "type": "choice", "text": "Does the mouse work smoothly at a speed that suits you?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Great! Remember a light-operated mouse can accumulate dust on its feet and in the light recess. Performance may vary depending on the desk surface, keep the desk surface clean.<p>You can adjust the speed and sensitivity of your mouse in your computer settings.</p>"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "<ul>\n<li>Clean the desk surface</li>\n<li>A light operated mouse collects dust on the feet and in the light recess. Clean the feet and light recess</li>\n<li>You can adjust the speed and sensitivity of the mouse in your computer settings</li>\n</ul>"}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q10", "section": "Display screens", "type": "choice", "text": "Are you happy with the brightness and contrast of your screen (text, images and display)?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Great! If you do need to make adjustments, you can investigate the settings of your computer or contact IT for advice. (And remember to keep your screen clean)."}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "<ul>\n<li>You can investigate the settings on your computer or contact IT for advice on brightness and contrast</li>\n<li>Make sure the screen is kept clean (wipes are available in SAS offices)</li>\n</ul>"}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q11", "section": "Display screens", "type": "choice", "text": "Is the text size comfortable to read?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Great! If you do encounter problems, you can usually adjust the size of text within the software or browser using the zoom settings provided or by using the Ctrl and +/- keys on your keyboard."}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Try adjusting the size of text within the software or browser using the zoom settings or by using the Ctrl and +/- keys on your keyboard."}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q12", "section": "Display screens", "type": "choice", "text": "Can you adjust the screen height, angle and tilt?\n         <p>Remember to make sure you can:</p>\n          <ul>\n<li>Adjust the screen height so that it is just below your eyeline</li>\n<li>Tilt the screen so you achieve a comfortable position</li>\n<li>Use swivel and tilt to avoid glare and reflection</li>\n</ul>\n <p>If you wear varifocal or bifocal glasses, you may have to fine tune the screen height to ensure you are looking through the correct part of lens.\nMake any necessary adjustments before continuing. \n</p>", "image": "screen-height.png", "alt": "Computer screen adjusted to just below eye level with a slight tilt to maintain a comfortable viewing angle", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Great!"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Your screen should be adjustable so try the steps below:\n          <ul>\n<li>Adjust the screen height so that it is just below your eyeline</li>\n<li>Tilt the screen so you achieve a comfortable position</li>\n<li>Use swivel and tilt to avoid glare and reflection</li>\n</ul>\n <p>Remember, if you wear varifocal or bifocal glasses you may have to fine tune the screen height to ensure you are looking through the correct part of lens. \n</p>"}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q13", "section": "Display screens", "type": "choice", "text": "Is your screen positioned about an arm length a , "actions": [{"type": "message", "text": "<p>Great! If you do have problems in the future, then turn the screen off to check where reflections are coming from. You might need to move the screen (or even the desk) or shield the screen from the source of the reflections.</p>\n      <p>You can adjust blinds or window coverings to deal with glare.</p>\n      <p>You may find that screens that use dark characters on a light background are less prone to glare and reflections.</p>"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "<p>Try turning the screen off to check where reflections are coming from. You might need to move the screen (or even the desk) or shield the screen from the source of the reflections.</p>\n        <p>You may need to adjust the blinds or window coverings.</p>\n        <p>Screens that use dark characters on a light background are less prone to glare and reflections. You may be able to change your display in your computer settings.</p>"}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q15", "section": "Other equipment", "type": "choice", "text": "A headset can be useful when you are on Teams calls or you are taking calls through your computer. Do you use a headset?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Good. we hope you find your headset useful."}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Do you require a headset?"}, {"type": "text", "prompt": "Add any information you would like to include.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q16", "section": "Software", "type": "choice", "text": "Is the software you use suitable for the task and are you confident in using the software?", "image": "", "alt": "", "responses": [{"label": "Yes", "acti e", "text": "Is the temperature, humidity and air quality in your workspace comfortable?\n        <ul>\n        <li>Air temperature, air flow and humidity in SAS offices are set within HSE standards, however everyone's own body temperature can be affected differently. If too hot - consider whether you can move away from the heat source? If too cold - consider localised heating or put on extra layers of clothing.</li>\n        <li>The only additional heating to be used in offices are SAS supplied oil filled radiators. Fans are not allowed in SAS offices.</li>\n        </ul>", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Good to hear!"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Please tell us a little more about this."}, {"type": "text", "prompt": "Add any information you would like to include.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q26", "section": "Environment", "type": "choice", "text": "Are levels of noise comfortable?\n        <ul>\n        <li>Noise levels in SAS offices are tested regularly to ensure they are within HSE standards. Consider if there is a quieter space to work? Noise cancelling headsets may be an option.</li>\n        </ul>", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Great!"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Please tell us a little more about this."}, {"type": "text", "prompt": "Add any information you would like to include.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q27", "section": "Final Checks", "type": "text", "text": "Are there any further problems with your workspace or DSE equipment that you haven't already told us about?", "image": "", "alt": "", "responses": [], "textPrompt": "Optional: type here if you'd like to add anything...", "required": false}, {"id": "dse-q28", "section": "Final Checks", "type": "text", "text": "Do you have any pain or discomfort that you attribute to using your DSE?", "image": "", "alt": "", "responses": [], "textPrompt": "Optional: type here if you'd like to add anything...", "required": false}, {"id": "dse-q29", "section": "Final Checks", "type": "choice", "text": "Are you aware of your entitlement to eye and eyesight testing?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Sight tests are free in Scotland, and you should arrange to have your eyes tested regularly by an optician.\n        <p>Some people suffer from eye strain, however there is no evidence that DSE causes damage to eyes.</p>\n        <p>If you require corrective lenses for the sole purpose of computer use (i.e. standard corrective lenses do not offer adequate correction) then the Service will meet the cost/make a contribution to the cost. Please refer to the Finance Department’s Procedure on the Reimbursement of Spectacle Costs ahead of arranging an eye examination with your optician</p>"}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "Some people suffer from eye strain, however there is no evidence that DSE causes damage to eyes.\n        <p>Sight tests are free in Scotland, and you should arrange to have your eyes tested regularly by an optician.</p>\n        <p>If you require corrective lenses for the sole purpose of computer use (i.e. standard corrective lenses do not offer adequate correction) then the Service will meet the cost/make a contribution to the cost. Please refer to the Finance Department’s Procedure on the Reimbursement of Spectacle Costs ahead of arranging an eye examination with your optician</p>"}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}, {"id": "dse-q30", "section": "Final Checks", "type": "choice", "text": "Do you take regular breaks working away from your display screen equipment?", "image": "", "alt": "", "responses": [{"label": "Yes", "actions": [{"type": "message", "text": "Great! You should incorporate micro breaks into your day. Take some time each hour to stand up or do something different, stepping away from your workstation for about 5 minutes every hour - or 10 minutes every two hours."}, {"type": "continue"}]}, {"label": "No", "actions": [{"type": "message", "text": "You should incorporate micro breaks into your day. Take some time each hour to stand up or do something different, stepping away from your workstation for about 5 minutes every hour - or 10 minutes every two hours."}, {"type": "text", "prompt": "If this is still an issue, you can add a note here.", "required": false}, {"type": "continue"}]}], "textPrompt": "", "required": false}]}};
let project = structuredClone(STARTERS.wellbeing);
let selectedPanel='settings', selectedQuestion=0;
let previewIndex=-1, previewAnswers=[], previewDetails={};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const uid=()=> 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
function dl(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function safeName(s){return (s||'guided-conversation').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()}

function newProject(){
 if(!confirm('Start a new blank bot? Unsaved changes will be lost.')) return;
 project={version:1,settings:{title:'New guided conversation',welcome:'Welcome. Use the options below to continue.',startLabel:'Start',primaryColour:'#b91e71',collectDetails:false,recordResponses:false,showReview:false,showProgress:true,completionTitle:'Complete',completionText:'Thanks for taking part.'},details:[],sections:[{id:uid(),name:'Section 1',colour:'#b91e71'}],questions:[]};
 selectedQuestion=0;selectPanel('settings');renderAll();resetPreview();
}
function loadStarter(which){if(!confirm('Load this example? Unsaved changes will be lost.'))return;project=structuredClone(STARTERS[which]);selectedQuestion=0;selectPanel('settings');renderAll();resetPreview()}
function saveProject(){dl(safeName(project.settings.title)+'.json',JSON.stringify(project,null,2),'application/json')}
document.getElementById('loadFile').addEventListener('change', async e=>{
 const f=e.target.files && e.target.files[0];
 const status=document.getElementById('projectStatus');
 if(!f)return;
 try{
   const loaded=JSON.parse(await f.text());
   if(!loaded || typeof loaded!=='object' || !loaded.settings || !Array.isArray(loaded.questions)){
     throw new Error('Missing project settings or questions.');
   }
   loaded.details=Array.isArray(loaded.details)?loaded.details:[];
   loaded.sections=Array.isArray(loaded.sections)&&loaded.sections.length?loaded.sections:[{id:uid(),name:'General',colour:loaded.settings.primaryColour||'#b91e71'}];
   loaded.settings.primaryColour=normaliseHex(loaded.settings.primaryColour)||'#b91e71';
   project=loaded;
   selectedQuestion=0;
   selectedPanel='settings';
   renderAll();
   resetPreview();
   selectPanel('settings');
   status.textContent='Loaded: '+f.name;
 }catch(err){
   console.error(err);
   status.textContent='Project could not be loaded.';
   alert('That file could not be loaded as a Guided Conversation Builder project.\n\n'+(err.message||'Invalid JSON file.'));
 }finally{
   e.target.value='';
 }
});

function selectPanel(name,el){
 selectedPanel=name;
 document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));
 if(el)el.classList.add('active'); else document.querySelector(`[data-panel="${name}"]`)?.classList.add('active');
 renderEditor();
}
function selectQuestion(i){selectedPanel='question';selectedQuestion=i;document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));renderQuestionList();renderEditor()}
function renderAll(){document.documentElement.style.setProperty('--brand',project.settings.primaryColour||'#b91e71');renderQuestionList();renderEditor();renderPreview()}
function renderQuestionList(){
 const box=$('#questionList');box.innerHTML='';
 project.questions.forEach((q,i)=>{const b=document.createElement('button');b.className='qitem'+(selectedPanel==='question'&&selectedQuestion===i?' active':'');b.innerHTML=`<strong>Q${i+1}</strong> ${esc(strip(q.text).slice(0,55))}<span class="qmeta">${esc(q.section||'No section')} · ${q.type==='text'?'Free text':(q.responses?.length||0)+' responses'}</span>`;b.onclick=()=>selectQuestion(i);box.appendChild(b)})
 if(!project.questions.length)box.innerHTML='<div class="empty">No questions yet.</div>';
}
function strip(s){const d=document.createElement('div');d.innerHTML=s||'';return d.textContent||''}
function field(label,value,oninput,type='text'){return `<label>${label}</label><input type="${type}" value="${esc(value)}" oninput="${oninput}">`}
function area(label,value,oninput){return `<label>${label}</label><textarea oninput="${oninput}">${esc(value)}</textarea>`}
function check(label,value,onchange){return `<label class="check"><input type="checkbox" ${value?'checked':''} onchange="${onchange}"> ${label}</label>`}

function renderEditor(){
 const e=$('#editor');
 if(selectedPanel==='settings'){
  const s=project.settings;e.innerHTML=`<h2>Bot settings</h2>
  ${field('Bot title',s.title,"setSetting('title',this.value)")}
  ${area('Welcome message',s.welcome,"setSetting('welcome',this.value)")}
  <div class="settings-pair">
  <div class="form-group">
    <label>Start button</label>
    <input type="text" value="${esc(s.startLabel)}" oninput="setSetting('startLabel',this.value)">
  </div>
  <div class="form-group">
    <label>Primary colour <span class="muted">(HEX)</span></label>
    <div class="colour-field">
      <input type="text" value="${esc(s.primaryColour)}" placeholder="#b91e71" maxlength="7" oninput="setHexSetting(this,'primaryColour')">
      <span class="colour-swatch" style="background:${esc(s.primaryColour)}" aria-hidden="true"></span>
    </div>
  </div>
</div>
  <hr><strong>Behaviour</strong>
  ${check('Collect user details before starting',s.collectDetails,"setSetting('collectDetails',this.checked)")}
  ${check('Record responses during the session',s.recordResponses,"setSetting('recordResponses',this.checked)")}
  ${check('Show a response review at the end',s.showReview,"setSetting('showReview',this.checked)")}
  ${check('Show progress',s.showProgress,"setSetting('showProgress',this.checked)")}
  ${field('Completion heading',s.completionTitle,"setSetting('completionTitle',this.value)")}
  ${area('Completion message',s.completionText,"setSetting('completionText',this.value)")}
  <div class="notice">For sensitive topics such as wellbeing, you can leave user details, response recording and review switched off. The exported bot then acts as a signposting conversation rather than a questionnaire record.</div>`;
 } else if(selectedPanel==='details'){
  e.innerHTML=`<div class="row"><h2 style="margin:0">User details</h2><button class="btn small fit" onclick="addDetail()">+ Add field</button></div>
  <p class="muted">These only appear when “Collect user details” is enabled.</p><div id="detailsEdit"></div>`;renderDetails();
 } else if(selectedPanel==='sections'){
  e.innerHTML=`<div class="row"><h2 style="margin:0">Sections</h2><button class="btn small fit" onclick="addSection()">+ Add section</button></div><div id="sectionsEdit"></div>`;renderSections();
 } else {renderQuestionEditor()}
}
function setSetting(k,v){project.settings[k]=v;if(k==='primaryColour')document.documentElement.style.setProperty('--brand',v);renderPreview()}
function normaliseHex(v){
 v=String(v||'').trim();
 if(!v)return '';
 if(!v.startsWith('#'))v='#'+v;
 if(/^#[0-9a-fA-F]{3}$/.test(v))v='#'+v.slice(1).split('').map(x=>x+x).join('');
 return /^#[0-9a-fA-F]{6}$/.test(v)?v.toLowerCase():'';
}
function setHexSetting(el,key){
 const hex=normaliseHex(el.value);
 const swatch=el.parentElement.querySelector('.colour-swatch');
 if(hex){
   el.style.borderColor='';
   project.settings[key]=hex;
   if(swatch)swatch.style.background=hex;
   document.documentElement.style.setProperty('--brand',hex);
   renderPreview();
 }else{
   el.style.borderColor='#b42318';
 }
}
function setSectionHex(i,el){
 const hex=normaliseHex(el.value);
 const swatch=el.parentElement.querySelector('.colour-swatch');
 if(hex){
   el.style.borderColor='';
   project.sections[i].colour=hex;
   if(swatch)swatch.style.background=hex;
   renderPreview();
 }else{
   el.style.borderColor='#b42318';
 }
}
function renderDetails(){const b=$('#detailsEdit');b.innerHTML='';project.details.forEach((d,i)=>{b.insertAdjacentHTML('beforeend',`<div class="response"><div class="row"><input type="text" value="${esc(d.label)}" oninput="project.details[${i}].label=this.value;renderPreview()"><label class="check fit"><input type="checkbox" ${d.required?'checked':''} onchange="project.details[${i}].required=this.checked"> Required</label><button class="btn danger small fit" onclick="project.details.splice(${i},1);renderEditor();renderPreview()">Delete</button></div></div>`)})}
function addDetail(){project.details.push({label:'New field',required:false});renderEditor();renderPreview()}
function renderSections(){const b=$('#sectionsEdit');b.innerHTML='';project.sections.forEach((s,i)=>{b.insertAdjacentHTML('beforeend',`<div class="response"><div class="row"><input type="text" value="${esc(s.name)}" oninput="renameSection(${i},this.value)"><input type="text" value="${esc(s.colour||project.settings.primaryColour)}" placeholder="#b91e71" maxlength="7" oninput="setSectionHex(${i},this)"><span class="fit colour-swatch" style="background:${esc(s.colour||project.settings.primaryColour)}"></span><button class="btn secondary small fit" onclick="moveSection(${i},-1)">↑</button><button class="btn secondary small fit" onclick="moveSection(${i},1)">↓</button><button class="btn danger small fit" onclick="deleteSection(${i})">Delete</button></div></div>`)})}
function addSection(){project.sections.push({id:uid(),name:'New section',colour:project.settings.primaryColour});renderEditor();renderQuestionList()}
function renameSection(i,n){const old=project.sections[i].name;project.sections[i].name=n;project.questions.forEach(q=>{if(q.section===old)q.section=n});renderQuestionList();renderPreview()}
function moveSection(i,d){const j=i+d;if(j<0||j>=project.sections.length)return;[project.sections[i],project.sections[j]]=[project.sections[j],project.sections[i]];renderEditor()}
function deleteSection(i){if(project.sections.length===1)return alert('Keep at least one section.');const s=project.sections[i].name;if(project.questions.some(q=>q.section===s)&&!confirm('Questions use this section. Delete it and move those questions to the first remaining section?'))return;project.sections.splice(i,1);project.questions.forEach(q=>{if(q.section===s)q.section=project.sections[0].name});renderEditor();renderQuestionList();renderPreview()}

function addQuestion(){
 const sec=project.sections[0]?.name||'General';project.questions.push({id:uid(),section:sec,type:'choice',text:'New question',image:'',alt:'',responses:[{label:'Yes',actions:[{type:'message',text:'Thanks.'},{type:'continue'}]},{label:'No',actions:[{type:'message',text:'Here is some information that may help.'},{type:'continue'}]}]});
 selectQuestion(project.questions.length-1);renderPreview()
}
function renderQuestionEditor(){
 const q=project.questions[selectedQuestion];const e=$('#editor');if(!q){e.innerHTML='<div class="empty">Add a question to begin.</div>';return}
 e.innerHTML=`<div class="row"><h2 style="margin:0">Question ${selectedQuestion+1}</h2><button class="btn secondary small fit" onclick="moveQuestion(-1)">↑</button><button class="btn secondary small fit" onclick="moveQuestion(1)">↓</button><button class="btn secondary small fit" onclick="duplicateQuestion()">Duplicate</button><button class="btn danger small fit" onclick="deleteQuestion()">Delete</button></div>
 <label>Section</label><select onchange="qset('section',this.value)">${project.sections.map(s=>`<option ${s.name===q.section?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
 <label>Question type</label><select onchange="changeQuestionType(this.value)"><option value="choice" ${q.type==='choice'?'selected':''}>Choice buttons</option><option value="text" ${q.type==='text'?'selected':''}>Free text</option></select>
 ${area('Question / prompt',q.text,"qset('text',this.value)")}
 <details><summary>Optional image</summary>${field('Image URL or file name',q.image||'',"qset('image',this.value)")}${field('Alt text',q.alt||'',"qset('alt',this.value)")}</details>
 <hr><div id="responseEditor"></div>`;
 renderResponses()
}
function qset(k,v){project.questions[selectedQuestion][k]=v;renderQuestionList();renderPreview()}
function changeQuestionType(t){const q=project.questions[selectedQuestion];q.type=t;if(t==='text'){q.textPrompt=q.textPrompt||'Type your response here...';q.required=!!q.required}else if(!q.responses?.length){q.responses=[{label:'Continue',actions:[{type:'continue'}]}]}renderEditor();renderPreview()}
function moveQuestion(d){const i=selectedQuestion,j=i+d;if(j<0||j>=project.questions.length)return;[project.questions[i],project.questions[j]]=[project.questions[j],project.questions[i]];selectedQuestion=j;renderAll()}
function duplicateQuestion(){const c=structuredClone(project.questions[selectedQuestion]);c.id=uid();project.questions.splice(selectedQuestion+1,0,c);selectedQuestion++;renderAll()}
function deleteQuestion(){if(!confirm('Delete this question?'))return;project.questions.splice(selectedQuestion,1);selectedQuestion=Math.max(0,selectedQuestion-1);selectedPanel=project.questions.length?'question':'settings';renderAll()}

function renderResponses(){
 const q=project.questions[selectedQuestion],b=$('#responseEditor');if(q.type==='text'){b.innerHTML=`<h3>Free-text settings</h3>${field('Input prompt',q.textPrompt||'Type here...',"qset('textPrompt',this.value)")}${check('Response required',q.required,"qset('required',this.checked)")}<p class="muted">After submitting, the conversation continues to the next question.</p>`;return}
 b.innerHTML=`<div class="row"><h3 style="margin:0">Responses</h3><button class="btn small fit" onclick="addResponse()">+ Add response</button></div><p class="muted">Each response can perform several actions in order.</p>`;
 q.responses.forEach((r,ri)=>{const wrap=document.createElement('div');wrap.className='response';wrap.innerHTML=`<div class="row"><input type="text" value="${esc(r.label)}" aria-label="Response label" oninput="project.questions[selectedQuestion].responses[${ri}].label=this.value;renderPreview()"><button class="btn secondary small fit" onclick="moveResponse(${ri},-1)">↑</button><button class="btn secondary small fit" onclick="moveResponse(${ri},1)">↓</button><button class="btn danger small fit" onclick="removeResponse(${ri})">Delete</button></div><div id="actions-${ri}"></div><button class="btn secondary small" onclick="addAction(${ri})">+ Add action</button>`;b.appendChild(wrap);renderActions(ri)})
}
function addResponse(){project.questions[selectedQuestion].responses.push({label:'New option',actions:[{type:'message',text:'Add feedback here.'},{type:'continue'}]});renderEditor();renderPreview()}
function removeResponse(i){project.questions[selectedQuestion].responses.splice(i,1);renderEditor();renderPreview()}
function moveResponse(i,d){const a=project.questions[selectedQuestion].responses,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];renderEditor();renderPreview()}
function addAction(ri){project.questions[selectedQuestion].responses[ri].actions.push({type:'message',text:'New message'});renderEditor()}
function renderActions(ri){
 const r=project.questions[selectedQuestion].responses[ri],box=$(`#actions-${ri}`);box.innerHTML='';
 r.actions.forEach((a,ai)=>{
  let body='';
  if(a.type==='message')body=area('Message',a.text||'',`aset(${ri},${ai},'text',this.value)`);
  if(a.type==='link')body=field('Button label',a.label||'',`aset(${ri},${ai},'label',this.value)`)+field('URL',a.url||'',`aset(${ri},${ai},'url',this.value)`,'url');
  if(a.type==='text')body=field('Prompt',a.prompt||'',`aset(${ri},${ai},'prompt',this.value)`)+check('Required',a.required,`aset(${ri},${ai},'required',this.checked)`);
  if(a.type==='jump')body=`<label>Jump to question</label><select onchange="aset(${ri},${ai},'target',this.value)"><option value="">Choose…</option>${project.questions.map((q,qi)=>`<option value="${q.id}" ${a.target===q.id?'selected':''}>Q${qi+1}: ${esc(strip(q.text).slice(0,45))}</option>`).join('')}</select>`;
  if(a.type==='continue')body='<p class="muted">Shows a Continue button. The learner moves to the next question only when they press it.</p>';
  if(a.type==='end')body='<p class="muted">Ends the conversation and shows the completion screen.</p>';
  box.insertAdjacentHTML('beforeend',`<div class="action"><div class="action-head"><strong>${esc(actionName(a.type))}</strong><select class="fit" onchange="changeActionType(${ri},${ai},this.value)">${['message','link','text','continue','jump','end'].map(t=>`<option value="${t}" ${a.type===t?'selected':''}>${actionName(t)}</option>`).join('')}</select><button class="btn secondary small fit" onclick="moveAction(${ri},${ai},-1)">↑</button><button class="btn secondary small fit" onclick="moveAction(${ri},${ai},1)">↓</button><button class="btn danger small fit" onclick="removeAction(${ri},${ai})">×</button></div>${body}</div>`)
 })
}
function actionName(t){return({message:'Show message',link:'Show link button',text:'Ask for text',continue:'Wait for Continue',jump:'Jump to question',end:'End conversation'})[t]||t}
function aset(ri,ai,k,v){project.questions[selectedQuestion].responses[ri].actions[ai][k]=v;renderPreview()}
function changeActionType(ri,ai,t){const defs={message:{type:t,text:'Add message here.'},link:{type:t,label:'Open resource',url:'https://'},text:{type:t,prompt:'Tell us more…',required:false},continue:{type:t},jump:{type:t,target:''},end:{type:t}};project.questions[selectedQuestion].responses[ri].actions[ai]=defs[t];renderEditor();renderPreview()}
function removeAction(ri,ai){project.questions[selectedQuestion].responses[ri].actions.splice(ai,1);renderEditor();renderPreview()}
function moveAction(ri,ai,d){const a=project.questions[selectedQuestion].responses[ri].actions,j=ai+d;if(j<0||j>=a.length)return;[a[ai],a[j]]=[a[j],a[ai]];renderEditor();renderPreview()}

function resetPreview(){previewIndex=-1;previewAnswers=[];previewDetails={};renderPreview()}
function renderPreview(){
 const p=$('#preview'),s=project.settings;p.innerHTML='';document.documentElement.style.setProperty('--brand',s.primaryColour||'#b91e71');
 if(previewIndex===-1){
  p.innerHTML=`<div class="preview-title">${esc(s.title)}</div><div class="msg bot">${s.welcome||''}</div>`;
  if(s.collectDetails&&project.details.length){p.innerHTML+=project.details.map((d,i)=>`<label>${esc(d.label)}${d.required?' *':''}</label><input type="text" data-detail="${i}">`).join('')}
  p.innerHTML+=`<div class="preview-buttons"><button onclick="startPreview()">${esc(s.startLabel||'Start')}</button></div>`;return
 }
 if(previewIndex>=project.questions.length){renderComplete();return}
 const q=project.questions[previewIndex],sec=project.sections.find(x=>x.name===q.section),pct=Math.round(((previewIndex+1)/Math.max(1,project.questions.length))*100);
 if(s.showProgress)p.innerHTML+=`<div class="muted">Question ${previewIndex+1} of ${project.questions.length}</div><div class="progress"><div style="width:${pct}%"></div></div>`;
 p.innerHTML+=`<div class="sectionhead" style="background:${esc(sec?.colour||s.primaryColour)}">${esc(q.section||'')}</div><div class="msg bot">${q.text||''}</div>`;
 if(q.image)p.innerHTML+=`<img src="${esc(q.image)}" alt="${esc(q.alt||'')}" style="max-width:100%;border-radius:8px">`;
 if(q.type==='text'){p.innerHTML+=`<label>${esc(q.textPrompt||'Type here...')}</label><textarea id="previewText"></textarea><div class="preview-buttons"><button onclick="submitPreviewText(${q.required?'true':'false'})">Continue</button></div>`}
 else p.innerHTML+=`<div class="preview-buttons">${(q.responses||[]).map((r,i)=>`<button onclick="choosePreview(${i})">${esc(r.label)}</button>`).join('')}</div>`;
}
function startPreview(){
 if(project.settings.collectDetails){let ok=true;project.details.forEach((d,i)=>{const el=document.querySelector(`[data-detail="${i}"]`);previewDetails[d.label]=el?.value||'';if(d.required&&!el?.value.trim()){el.style.borderColor='red';ok=false}});if(!ok)return}
 previewIndex=0;renderPreview()
}
function submitPreviewText(req){const t=$('#previewText').value.trim();if(req&&!t)return alert('Please enter a response.');if(project.settings.recordResponses)previewAnswers.push({question:project.questions[previewIndex].text,answer:t});previewIndex++;renderPreview()}
async function choosePreview(ri){
 const q=project.questions[previewIndex],r=q.responses[ri];if(project.settings.recordResponses)previewAnswers.push({question:q.text,answer:r.label});await runPreviewActions(r.actions||[],0)
}
async function runPreviewActions(actions,pos){
 const p=$('#preview');if(pos>=actions.length)return;
 const a=actions[pos];
 if(a.type==='message'){p.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(project.questions[previewIndex].responses.find(r=>r.actions===actions)?.label||'')}</div><div class="msg bot">${a.text||''}</div>`);return runPreviewActions(actions,pos+1)}
 if(a.type==='link'){p.insertAdjacentHTML('beforeend',`<p><a class="linkbtn" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.label||'Open link')}</a></p>`);return runPreviewActions(actions,pos+1)}
 if(a.type==='text'){p.insertAdjacentHTML('beforeend',`<label>${esc(a.prompt||'Type here...')}</label><textarea id="actionText"></textarea><div class="preview-buttons"><button id="actionContinue">Continue</button></div>`);$('#actionContinue').onclick=()=>{const v=$('#actionText').value.trim();if(a.required&&!v)return alert('Please enter a response.');if(project.settings.recordResponses)previewAnswers.push({question:a.prompt,answer:v});runPreviewActions(actions,pos+1)};return}
 if(a.type==='jump'){const j=project.questions.findIndex(q=>q.id===a.target);previewIndex=j>=0?j:previewIndex+1;return renderPreview()}
 if(a.type==='end'){previewIndex=project.questions.length;return renderPreview()}
 if(a.type==='continue'){
   p.insertAdjacentHTML('beforeend',`<div class="preview-buttons"><button id="previewNextAction">Continue</button></div>`);
   $('#previewNextAction').onclick=()=>{previewIndex++;renderPreview()};
   return;
 }
}
function renderComplete(){const p=$('#preview'),s=project.settings;p.innerHTML=`<div class="preview-title">${esc(s.completionTitle||'Complete')}</div><div class="msg bot">${s.completionText||''}</div>`;if(s.showReview&&s.recordResponses&&previewAnswers.length){p.innerHTML+='<h3>Your responses</h3>'+previewAnswers.map((a,i)=>`<div class="response"><strong>Q${i+1}</strong><br>${a.question}<br><span class="muted">${esc(a.answer)}</span></div>`).join('')}p.innerHTML+='<div class="preview-buttons"><button onclick="resetPreview()">Start again</button></div>'}

function exportBot(){
 const data=JSON.stringify(project).replace(/</g,'\\u003c');
 const runtime=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>${esc(project.settings.title)}</title>
<style>:root{--brand:${esc(project.settings.primaryColour)}}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f8f9fa;margin:0;padding:18px;color:#202124}.app{max-width:650px;margin:auto;background:#fff;padding:16px;border-radius:10px;box-shadow:0 2px 8px #0001}button,.link{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px 13px;margin:5px;cursor:pointer;text-decoration:none;display:inline-block}input,textarea{width:100%;padding:9px;margin:5px 0 10px;border:1px solid #ccc;border-radius:6px}.msg{padding:11px;border-radius:8px;margin:9px 0;line-height:1.45}.bot{background:#fce8f2}.user{background:#e9ecef;margin-left:35%;text-align:right}.section{padding:10px;border-radius:7px;color:#fff;font-weight:bold;margin:8px 0}.progress{height:8px;background:#e9ecef;border-radius:20px;overflow:hidden}.progress div{height:100%;background:var(--brand)}img{max-width:100%;border-radius:8px}.review{border-top:1px solid #ddd;padding:9px 0}</style></head><body><main class="app" id="app"></main>
<script>const project=${data};let idx=-1,answers=[],details={};const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(){const s=project.settings;app.innerHTML='';if(idx===-1){app.innerHTML='<h2>'+esc(s.title)+'</h2><div class="msg bot">'+s.welcome+'</div>';if(s.collectDetails)app.innerHTML+=project.details.map((d,i)=>'<label>'+esc(d.label)+(d.required?' *':'')+'</label><input data-d="'+i+'">').join('');app.innerHTML+='<button onclick="start()">'+esc(s.startLabel||'Start')+'</button>';return}if(idx>=project.questions.length){complete();return}const q=project.questions[idx],sec=project.sections.find(x=>x.name===q.section),pct=Math.round((idx+1)/Math.max(1,project.questions.length)*100);if(s.showProgress)app.innerHTML+='<small>Question '+(idx+1)+' of '+project.questions.length+'</small><div class="progress"><div style="width:'+pct+'%"></div></div>';app.innerHTML+='<div class="section" style="background:'+(sec?.colour||s.primaryColour)+'">'+esc(q.section||'')+'</div><div class="msg bot">'+q.text+'</div>';if(q.image)app.innerHTML+='<img src="'+esc(q.image)+'" alt="'+esc(q.alt||'')+'">';if(q.type==='text')app.innerHTML+='<label>'+esc(q.textPrompt||'Type here...')+'</label><textarea id="txt"></textarea><button onclick="textNext('+(q.required?'true':'false')+')">Continue</button>';else app.innerHTML+=(q.responses||[]).map((r,i)=>'<button onclick="choose('+i+')">'+esc(r.label)+'</button>').join('')}function start(){if(project.settings.collectDetails){let ok=true;project.details.forEach((d,i)=>{const e=document.querySelector('[data-d="'+i+'"]');details[d.label]=e.value;if(d.required&&!e.value.trim()){e.style.borderColor='red';ok=false}});if(!ok)return}idx=0;render()}function textNext(req){const v=document.getElementById('txt').value.trim();if(req&&!v)return alert('Please enter a response.');if(project.settings.recordResponses)answers.push({question:project.questions[idx].text,answer:v});idx++;render()}function choose(i){const q=project.questions[idx],r=q.responses[i];app.innerHTML+='<div class="msg user">'+esc(r.label)+'</div>';if(project.settings.recordResponses)answers.push({question:q.text,answer:r.label});actions(r.actions||[],0)}function actions(a,p){if(p>=a.length)return;const x=a[p];if(x.type==='message'){app.innerHTML+='<div class="msg bot">'+x.text+'</div>';return actions(a,p+1)}if(x.type==='link'){app.innerHTML+='<a class="link" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.label||'Open link')+'</a>';return actions(a,p+1)}if(x.type==='text'){app.innerHTML+='<label>'+esc(x.prompt||'Type here...')+'</label><textarea id="follow"></textarea><button id="followbtn">Continue</button>';document.getElementById('followbtn').onclick=()=>{const v=document.getElementById('follow').value.trim();if(x.required&&!v)return alert('Please enter a response.');if(project.settings.recordResponses)answers.push({question:x.prompt,answer:v});actions(a,p+1)};return}if(x.type==='jump'){const j=project.questions.findIndex(q=>q.id===x.target);idx=j>=0?j:idx+1;return render()}if(x.type==='end'){idx=project.questions.length;return render()}if(x.type==='continue'){app.innerHTML+='<div><button id="nextAction">Continue</button></div>';document.getElementById('nextAction').onclick=()=>{idx++;render()};return}}function complete(){const s=project.settings;app.innerHTML='<h2>'+esc(s.completionTitle||'Complete')+'</h2><div class="msg bot">'+s.completionText+'</div>';if(s.showReview&&s.recordResponses&&answers.length)app.innerHTML+='<h3>Your responses</h3>'+answers.map((a,i)=>'<div class="review"><strong>Q'+(i+1)+'</strong><br>'+a.question+'<br><small>'+esc(a.answer)+'</small></div>').join('');app.innerHTML+='<button onclick="idx=-1;answers=[];details={};render()">Start again</button>'}render();<\/script></body></html>`;
 dl(safeName(project.settings.title)+'.html',runtime,'text/html')
}
renderAll();resetPreview();
</script>
</body></html>
